name: Build Android release

# Tạo đủ 2 file cho mỗi bản phát hành:
#   - FlashCard-v<version>-debug.apk  : cài trực tiếp trên máy (local)
#   - FlashCard-v<version>-release.aab: tải lên Google Play Console cho tester
#
# Chạy tay ở tab Actions, hoặc tự chạy khi đẩy tag dạng v1.2.0.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài thư viện npm
        run: npm ci

      - name: Đồng bộ giao diện vào Capacitor
        run: |
          npm run sync:web
          npx cap sync android

      - name: Đọc số hiệu phiên bản
        id: version
        run: |
          NAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          CODE=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Chuẩn bị khóa upload
        env:
          STORE_BASE64: ${{ secrets.FLASHCARD_STORE_BASE64 }}
        run: |
          if [ -n "$STORE_BASE64" ]; then
            echo "$STORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
            echo "FLASHCARD_STORE_FILE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
            echo "Đã nạp khóa upload, AAB sẽ được ký."
          else
            echo "Chưa có secret FLASHCARD_STORE_BASE64 nên AAB sẽ chưa được ký."
          fi

      - name: Build APK debug và AAB release
        env:
          FLASHCARD_STORE_PASSWORD: ${{ secrets.FLASHCARD_STORE_PASSWORD }}
          FLASHCARD_KEY_ALIAS: ${{ secrets.FLASHCARD_KEY_ALIAS }}
          FLASHCARD_KEY_PASSWORD: ${{ secrets.FLASHCARD_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Đặt tên file phát hành
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/FlashCard-v${{ steps.version.outputs.name }}-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release*.aab \
             "dist/FlashCard-v${{ steps.version.outputs.name }}-release.aab"
          ls -lh dist

      - name: Tải file lên Actions
        uses: actions/upload-artifact@v4
        with:
          name: flashcard-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}
          path: dist/*
          retention-days: 30

      - name: Tạo GitHub Release khi đẩy tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "FlashCard ${GITHUB_REF_NAME}" \
            --notes "Bản build ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}). APK để cài local, AAB để tải lên Google Play Console."
